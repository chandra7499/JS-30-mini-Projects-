<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
   
</head>


<body class="flex justify-center items-center h-[100vh]" style="background: linear-gradient(to top, rgb(9, 32, 63) 0%, rgb(83, 120, 149) 100%);">
   
    <div class="calculatorContainer h-[110%] w-[100%] xl:w-[300px]  overflow-hidden sm:h-[500px] sm:w-[300px] md:w-[300px]  lg:h-[500px]  lg:scale-[1.3]  flex justify-evenly flex-col shrink-0 scale-[0.66] sm:scale-[1.7] xl:scale-[1.12] bg-slate-800 rounded-lg">
    <form action="" class="form flex flex-col  w-[100%] h-[100%]">
        <div class="userInputDisplay w-[100%] h-[36%] flex justify-end flex-col items-end px-2 rounded-lg bg-slate-900 " style="box-shadow: inset -3px -3px 3px rgba(136, 136, 136, 0.25);">
           <input type="text" class="input mb-2 text-5xl font-sans w-[100%] bg-slate-900 rounded-lg  text-slate-300 text-end" placeholder="0" name="input" style="scroll-behavior:smooth; scrollbar-width: none; outline: none;" />
           <p name="result" class="result  overflow-x-scroll w-[100%] text-right text-xl text-slate-400 mt-1 " style="scrollbar-width:none;"></p>
        </div>

<div class="OperationsSet flex flex-row h-[100%] w-[100%]   overflow-hidden xl:w-[100%]">

        <div class="calciOperation grid grid-cols-4 shrink-0 max-h-[100%]  text-white items-strat gap-5  transition-all ease-linear duration-700  sm:w-[300px] w-[100%] px-2 ">
            
            <input type="button" value="AC" class="btn btnAc bg-sky-950 rounded-full text-lg font-serif   cursor-pointer transition-colors ease-linear" style="box-shadow: inset -4px -4px 8px rgba(255, 255, 255, 0.19),inset 4px 4px 8px rgb(0, 0, 0,0.3);"></input>
            <input type="button" value="DE" class="btn btnDe bg-orange-950 rounded-full text-lg font-serif cursor-pointer transition-colors ease-linear" style="box-shadow: inset -4px -4px 8px rgba(255, 255, 255, 0.19),inset 4px 4px 8px rgb(0, 0, 0,0.3);"></input>
            <input type="button" value="." onclick="input.value+='.'" class="btn dot  bg-slate-900  justify-center font-bold rounded-full text-xl font-serif cursor-pointer transition-colors ease-linear" style="box-shadow: inset -4px -4px 8px rgba(255, 255, 255, 0.25),inset 4px 4px 8px rgb(0, 0, 0,0.3);"></input>
            <input type="button" value="/" onclick="input.value+='/'" class="btn divide font-bold bg-slate-900 rounded-full text-xl cursor-pointer font-serif transition-colors ease-linear" style="box-shadow: inset -4px -4px 8px rgba(255, 255, 255, 0.25),inset 4px 4px 8px rgb(0, 0, 0,0.3);"></input>
            <input type="button" value="7" onclick="input.value+=7" class="btn btn7  hover:bg-slate-900 rounded-full text-lg font-semibold cursor-pointer transition-colors ease-linear" style="box-shadow: inset -4px -4px 8px rgba(255, 255, 255, 0.19),inset 4px 4px 8px rgb(0, 0, 0,0.3);"></input>
            <input type="button" value="8" onclick="input.value+=8" class="btn btn8 hover:bg-slate-900 rounded-full text-lg font-semibold cursor-pointer transition-colors ease-linear" style="box-shadow: inset -4px -4px 8px rgba(255, 255, 255, 0.19),inset 4px 4px 8px rgb(0, 0, 0,0.3);"></input>
            <input type="button" value="9" onclick="input.value+=9" class="btn btn9 hover:bg-slate-900 rounded-full text-lg font-semibold cursor-pointer transition-colors ease-linear" style="box-shadow: inset -4px -4px 8px rgba(255, 255, 255, 0.19),inset 4px 4px 8px rgb(0, 0, 0,0.3);"></input>
            <input type="button" value="*" onclick="input.value+='*'" class="btn multiply font-bold bg-slate-900 cursor-pointer rounded-full text-lg font-serif transition-colors ease-linear" style="box-shadow: inset -4px -4px 8px rgba(255, 255, 255, 0.25),inset 4px 4px 8px rgb(0, 0, 0,0.3);"></input>
            <input type="button" value="4" onclick="input.value+=4" class="btn btn4 hover:bg-slate-900 rounded-full text-lg font-semibold cursor-pointer transition-colors ease-linear" style="box-shadow: inset -4px -4px 8px rgba(255, 255, 255, 0.19),inset 4px 4px 8px rgb(0, 0, 0,0.3);"></input>
            <input type="button" value="5" onclick="input.value+=5" class="btn btn5 hover:bg-slate-900 rounded-full text-lg font-semibold cursor-pointer transition-colors ease-linear" style="box-shadow: inset -4px -4px 8px rgba(255, 255, 255, 0.19),inset 4px 4px 8px rgb(0, 0, 0,0.3);"></input>
            <input type="button" value="6" onclick="input.value+=6" class="btn btn6 hover:bg-slate-900 rounded-full text-lg font-semibold cursor-pointer transition-colors ease-linear" style="box-shadow: inset -4px -4px 8px rgba(255, 255, 255, 0.19),inset 4px 4px 8px rgb(0, 0, 0,0.3);"></input>
            <input type="button" value="-" onclick="input.value+='-'" class="btn minus font-bold bg-slate-900 rounded-full cursor-pointer text-lg font-serif transition-colors ease-linear" style="box-shadow: inset -4px -4px 8px rgba(255, 255, 255, 0.25),inset 4px 4px 8px rgb(0, 0, 0,0.3);"></input>
            <input type="button" value="1" onclick="input.value+=1" class="btn btn1 hover:bg-slate-900 rounded-full cursor-pointer text-lg font-semibold transition-colors ease-linear" style="box-shadow: inset -4px -4px 8px rgba(255, 255, 255, 0.19),inset 4px 4px 8px rgb(0, 0, 0,0.3);"></input>
            <input type="button" value="2" onclick="input.value+=2" class="btn btn2 hover:bg-slate-900 cursor-pointer rounded-full text-lg font-semibold transition-colors ease-linear" style="box-shadow: inset -4px -4px 8px rgba(255, 255, 255, 0.19),inset 4px 4px 8px rgb(0, 0, 0,0.3);"></input>
            <input type="button" value="3" onclick="input.value+=3" class="btn btn3 hover:bg-slate-900 cursor-pointer rounded-full text-lg font-semibold transition-colors ease-linear" style="box-shadow: inset -4px -4px 8px rgba(255, 255, 255, 0.19),inset 4px 4px 8px rgb(0, 0, 0,0.3);"></input>
            <input type="button" value="+" onclick="input.value+='+'" class="btn plus font-bold cursor-pointer bg-slate-900 rounded-full text-lg font-serif transition-colors ease-linear" style="box-shadow: inset -4px -4px 8px rgba(255, 255, 255, 0.25),inset 4px 4px 8px rgb(0, 0, 0,0.3);"></input>
            <button type="button" class="layer hover:bg-slate-900 rounded-full text-lg btn font-semibold transition-colors  bg-slate-900 ease-linear" style="box-shadow: inset -4px -4px 8px rgba(255, 255, 255, 0.19),inset 4px 4px 8px rgb(0, 0, 0,0.3);"><ion-icon name="layers-outline"></ion-icon></button>
            <input type="button" value="0" onclick="input.value+=0" class="zero btn hover:bg-slate-900 rounded-full text-lg font-semibold text-opacity-5 cursor-pointer transition-colors ease-linear" style="box-shadow: inset -4px -4px 8px rgba(255, 255, 255, 0.19),inset 4px 4px 8px rgb(0, 0, 0,0.3);"></input>
            <input type="button" value="=" class="equal bg-green-950 rounded-lg w-[auto]   flex flex-shrink-0 justify-center items-center text-center h-[auto] text-2xl cursor-pointer font-serif transition-colors ease-linear" style="box-shadow: inset -4px -4px 8px rgba(255, 255, 255, 0.19),inset 4px 4px 8px rgb(0, 0, 0,0.3);"></input>
            <input type="button" value="%" onclick="input.value+='%'" class="plus font-bold btn cursor-pointer bg-slate-900 rounded-full text-lg font-serif transition-colors ease-linear" style="box-shadow: inset -4px -4px 8px rgba(255, 255, 255, 0.25),inset 4px 4px 8px rgb(0, 0, 0,0.3);"></input>
        </div>
   

        <div class="AdvanceCalucations grid grid-cols-3  min-h-min absolute transition-all ease-linear duration-600 w-0  right-0  bottom-0   justify-between items-center rounded-lg overflow-y-scroll xl:relative   text-white gap-2  py-5">
       
            <input type="button" value="x^" onclick="input.value+='**'" class="plus h-[60px] w-[60px] font-bold btn cursor-pointer  bg-slate-900 rounded-lg   text-lg font-serif transition-colors ease-linear secBtn" style="box-shadow: inset -4px -4px 8px rgba(255, 255, 255, 0.25),inset 4px 4px 8px rgb(0, 0, 0,0.3);"></input>
            <input type="button" value="log" onclick="input.value+='log('"class="plus h-[60px] w-[60px] font-bold btn cursor-pointer bg-slate-900 rounded-lg text-lg font-serif transition-colors ease-linear secBtn log" style="box-shadow: inset -4px -4px 8px rgba(255, 255, 255, 0.25),inset 4px 4px 8px rgb(0, 0, 0,0.3);"></input>
            <input type="button" value="sqrt"   onclick="input.value+='sqrt('" class="plus h-[60px] w-[60px] font-bold btn cursor-pointer bg-slate-900 rounded-lg text-lg font-serif transition-colors ease-linear secBtn root" style="box-shadow: inset -4px -4px 8px rgba(255, 255, 255, 0.25),inset 4px 4px 8px rgb(0, 0, 0,0.3);"></input>
            <input type="button" value="ln"  onclick="input.value+='ln('" class="plus h-[60px] w-[60px] font-bold btn cursor-pointer bg-slate-900 rounded-lg text-lg font-serif transition-colors ease-linear secBtn ln" style="box-shadow: inset -4px -4px 8px rgba(255, 255, 255, 0.25),inset 4px 4px 8px rgb(0, 0, 0,0.3);"></input>
            <input type="button" value="x!" onclick="input.value+='!'" class="plus h-[60px] w-[60px] font-bold btn cursor-pointer bg-slate-900 rounded-lg text-lg font-serif transition-colors ease-linear secBtn factorial" style="box-shadow: inset -4px -4px 8px rgba(255, 255, 255, 0.25),inset 4px 4px 8px rgb(0, 0, 0,0.3);"></input>
            <input type="button" value="("  onclick="input.value+='('" class="plus h-[60px] w-[60px] font-bold btn cursor-pointer bg-slate-900 rounded-lg text-lg font-serif transition-colors ease-linear secBtn " style="box-shadow: inset -4px -4px 8px rgba(255, 255, 255, 0.25),inset 4px 4px 8px rgb(0, 0, 0,0.3);"></input>
            <input type="button" value="sin" onclick="input.value+='sin('" class="plus h-[60px] w-[60px] font-bold btn cursor-pointer bg-slate-900 rounded-lg text-lg font-serif transition-colors ease-linear secBtn sinValue" style="box-shadow: inset -4px -4px 8px rgba(255, 255, 255, 0.25),inset 4px 4px 8px rgb(0, 0, 0,0.3);"></input>
            <input type="button" value="cos" onclick="input.value+='cos('" class="plus h-[60px] w-[60px] font-bold btn cursor-pointer bg-slate-900 rounded-lg text-lg font-serif transition-colors ease-linear secBtn cosValue" style="box-shadow: inset -4px -4px 8px rgba(255, 255, 255, 0.25),inset 4px 4px 8px rgb(0, 0, 0,0.3);"></input>
            <input type="button" value=")"   onclick="input.value+=')'"class="plus font-bold btn h-[60px] w-[60px] cursor-pointer bg-slate-900 rounded-lg text-lg font-serif transition-colors ease-linear secBtn " style="box-shadow: inset -4px -4px 8px rgba(255, 255, 255, 0.25),inset 4px 4px 8px rgb(0, 0, 0,0.3);"></input>
            <input type="button" value="tan" onclick="input.value+='tan('" class="plus h-[60px] w-[60px] font-bold btn cursor-pointer bg-slate-900 rounded-lg text-lg font-serif transition-colors ease-linear secBtn tanValue" style="box-shadow: inset -4px -4px 8px rgba(255, 255, 255, 0.25),inset 4px 4px 8px rgb(0, 0, 0,0.3);"></input>
            <input type="button" value="e"   onclick="input.value+=`${Math.E}`" class="plus h-[60px] w-[60px] font-bold btn cursor-pointer bg-slate-900 rounded-lg text-lg font-serif transition-colors ease-linear secBtn eValue" style="box-shadow: inset -4px -4px 8px rgba(255, 255, 255, 0.25),inset 4px 4px 8px rgb(0, 0, 0,0.3);"></input>
            <input type="button" value="π"   onclick="input.value+=`${Math.PI}`" class="plus h-[60px] w-[60px] font-bold btn cursor-pointer bg-slate-900 rounded-lg text-lg font-serif transition-colors ease-linear secBtn piValue" style="box-shadow: inset -4px -4px 8px rgba(255, 255, 255, 0.25),inset 4px 4px 8px rgb(0, 0, 0,0.3);"></input>

         

        </div>

        
  </div>
    </form>
    </div>
   

   





   
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <script src="calculator.js"></script>

</body>

</html>
